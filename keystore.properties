# Signing configuration for release builds.
#
# This file is tracked in git and contains no secrets. Values written as
# ${NAME} are replaced with the environment variable NAME at build time, so CI
# can supply them from repository secrets and nothing sensitive is committed.
#
# For local builds, either export the variables or put the real values in a
# git-ignored keystore.properties.local next to this file; anything it sets
# overrides the values here.
storeFile=release.keystore
storePassword=${RELEASE_STORE_PASSWORD}
keyAlias=pkmn
keyPassword=${RELEASE_KEY_PASSWORD}
